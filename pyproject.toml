[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgkit"
version = "0.1.0"
description = "Search, summarize and track tasks from your own Telegram chats. Local copy, works offline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["telethon>=1.36"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tgkit = "tgkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
